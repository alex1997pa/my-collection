<style>
  :root {
    --bg: #f6f1e7; --paper: #fffdf8; --ink: #231f1c; --muted: #7a7068; --line: #e4dccd;
    --accent: #b9382f; --accent-soft: #f3dfd8; --chip: #ede5d6;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f; --paper: #1f1b16; --ink: #efe7da; --muted: #a39684; --line: #3a332a;
      --accent: #e0574b; --accent-soft: #3d221d; --chip: #2a251e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: var(--accent); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

  header.site { padding: 40px 0 24px; }
  .brand { display: flex; gap: 16px; align-items: center; }
  .brand img { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; }
  h1 { font: 700 clamp(26px, 5vw, 38px)/1.15 var(--serif); margin: 0; letter-spacing: .01em; }
  .lead { margin: 14px 0 0; max-width: 70ch; color: var(--muted); white-space: pre-line; }
  .meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
  .contact { margin-top: 12px; font-size: 14px; }
  .rule { height: 3px; width: 64px; background: var(--accent); margin-top: 22px; border-radius: 2px; }

  .bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search], select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; min-width: 0; }
  input[type=search] { flex: 1 1 220px; }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; font: 500 13px var(--sans); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; }
  .chip span { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed=true] { background: var(--ink); color: var(--bg); }
  .count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  main { padding: 20px 0 56px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .card { display: flex; flex-direction: column; text-align: left; font: inherit; color: inherit; background: var(--paper);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; padding: 0; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgb(0 0 0 / .08); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 3 / 4; background: var(--chip); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .noimg { font: 700 28px var(--serif); color: var(--line); }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card h2 { font: 600 14px/1.35 var(--sans); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { align-self: flex-start; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    border-radius: 6px; padding: 2px 7px; }
  .empty { text-align: center; color: var(--muted); padding: 64px 0; }

  dialog { border: 0; padding: 0; width: min(980px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 16px;
    background: var(--paper); color: var(--ink); box-shadow: 0 24px 60px rgb(0 0 0 / .3); }
  dialog::backdrop { background: rgb(20 16 12 / .55); }
  .detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); max-height: calc(100dvh - 24px); }
  @media (max-width: 760px) { .detail { grid-template-columns: 1fr; overflow-y: auto; } }
  .gallery { background: var(--chip); display: flex; flex-direction: column; min-height: 0; }
  .stage { position: relative; flex: 1; min-height: 280px; display: grid; place-items: center; }
  .stage img { max-width: 100%; max-height: min(72dvh, 680px); object-fit: contain; display: block; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgb(0 0 0 / .45); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }
  .strip { display: flex; gap: 6px; padding: 8px; overflow-x: auto; }
  .strip button { flex-shrink: 0; width: 56px; height: 56px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden;
    cursor: pointer; background: none; }
  .strip button[aria-current=true] { border-color: var(--accent); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .info .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .info .cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .info h3 { font: 700 24px/1.25 var(--serif); margin: 4px 0 0; }
  .close { border: 0; background: var(--chip); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .share { align-self: flex-start; font: 600 14px var(--sans); color: var(--bg); background: var(--ink); border: 0; border-radius: 10px;
    padding: 9px 14px; cursor: pointer; }
  footer { border-top: 1px solid var(--line); padding: 20px 0 32px; font-size: 12px; color: var(--muted); }
</style>

<script>
(function () {
  var items = JSON.parse(document.getElementById("data").textContent);
  items.forEach(function (it, i) { it.rank = i; it.key = (it.t + " " + (it.g || "") + " " + (it.p || "") + " " + it.a.map(function (a) { return a[1]; }).join(" ")).toLowerCase(); });
  var state = { q: "", group: "", cat: "", sort: "recent" };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), dlg = $("dlg");

  function photo(id, size) { return "foto/" + id + "-" + size + ".webp"; }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs) { if (k === "text") node.textContent = attrs[k]; else node.setAttribute(k, attrs[k]); }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function countBy(list, fn) {
    var map = {};
    list.forEach(function (it) { var v = fn(it); if (v) map[v] = (map[v] || 0) + 1; });
    return map;
  }

  // Categorie: il filtro compare solo se ce n'e' piu' di una.
  var cats = countBy(items, function (it) { return it.c; });
  var catNames = Object.keys(cats).sort(function (a, b) { return a.localeCompare(b, "it"); });
  if (catNames.length > 1) {
    var sel = $("cat");
    sel.hidden = false;
    sel.appendChild(el("option", { value: "", text: "Tutte le categorie" }));
    catNames.forEach(function (c) { sel.appendChild(el("option", { value: c, text: c + " (" + cats[c] + ")" })); });
    sel.addEventListener("change", function () { state.cat = sel.value; state.group = ""; render(); });
  }

  function renderGroups(pool) {
    var counts = countBy(pool, function (it) { return it.g; });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, "it"); });
    var box = $("groups");
    box.textContent = "";
    box.hidden = names.length < 2;
    if (state.group && !counts[state.group]) state.group = "";
    [["", "Tutte", pool.length]].concat(names.map(function (n) { return [n, n, counts[n]]; })).forEach(function (g) {
      var b = el("button", { type: "button", class: "chip", "aria-pressed": String(state.group === g[0]), text: g[1] }, [el("span", { text: String(g[2]) })]);
      b.addEventListener("click", function () { state.group = g[0]; render(); });
      box.appendChild(b);
    });
  }

  function card(it) {
    var thumb = el("div", { class: "thumb" }, [
      it.f.length ? el("img", { src: photo(it.f[0], "s"), alt: "", loading: "lazy", decoding: "async" }) : el("span", { class: "noimg", text: "目録" }),
    ]);
    var body = el("div", { class: "body" }, [el("h2", { text: it.t }), it.g ? el("span", { class: "tag", text: it.g }) : null]);
    var b = el("button", { type: "button", class: "card", "aria-label": it.t + (it.g ? ", " + it.g : "") }, [thumb, body]);
    b.addEventListener("click", function () { open(it); });
    return b;
  }

  function render() {
    var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    var pool = items.filter(function (it) { return !state.cat || it.c === state.cat; });
    renderGroups(pool);
    var list = pool.filter(function (it) {
      return (!state.group || it.g === state.group) && words.every(function (w) { return it.key.indexOf(w) !== -1; });
    });
    list.sort(state.sort === "title" ? function (a, b) { return a.t.localeCompare(b.t, "it"); } : function (a, b) { return a.rank - b.rank; });
    grid.textContent = "";
    var frag = document.createDocumentFragment();
    list.forEach(function (it) { frag.appendChild(card(it)); });
    grid.appendChild(frag);
    $("empty").hidden = list.length > 0;
    $("count").textContent = list.length + (list.length === 1 ? " oggetto" : " oggetti");
  }

  // Dettaglio con galleria; l'indirizzo #slug apre direttamente l'oggetto.
  var current = null, index = 0;
  function show(i) {
    if (!current || !current.f.length) return;
    index = (i + current.f.length) % current.f.length;
    $("dlg-img").src = photo(current.f[index], "l");
    Array.prototype.forEach.call($("strip").children, function (b, j) { b.setAttribute("aria-current", String(j === index)); });
  }
  function open(it) {
    current = it;
    $("dlg-cat").textContent = it.c;
    $("dlg-title").textContent = it.t;
    var dl = $("dlg-attrs");
    dl.textContent = "";
    var rows = it.a.slice();
    if (it.p) rows.push(["Codice", it.p]);
    rows.forEach(function (r) { dl.appendChild(el("dt", { text: r[0] })); dl.appendChild(el("dd", { text: r[1] })); });
    var strip = $("strip");
    strip.textContent = "";
    it.f.forEach(function (id, j) {
      var b = el("button", { type: "button", "aria-label": "Foto " + (j + 1) }, [el("img", { src: photo(id, "s"), alt: "", loading: "lazy" })]);
      b.addEventListener("click", function () { show(j); });
      strip.appendChild(b);
    });
    var many = it.f.length > 1;
    strip.hidden = !many; $("prev").hidden = !many; $("next").hidden = !many;
    $("dlg-img").hidden = !it.f.length;
    $("dlg-img").alt = it.t;
    show(0);
    if (location.hash !== "#" + it.s) history.replaceState(null, "", "#" + it.s);
    if (!dlg.open) dlg.showModal();
  }
  function close() { dlg.close(); }
  dlg.addEventListener("close", function () { current = null; history.replaceState(null, "", location.pathname + location.search); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) close(); });
  $("close").addEventListener("click", close);
  $("prev").addEventListener("click", function () { show(index - 1); });
  $("next").addEventListener("click", function () { show(index + 1); });
  document.addEventListener("keydown", function (e) {
    if (!dlg.open) return;
    if (e.key === "ArrowLeft") show(index - 1);
    if (e.key === "ArrowRight") show(index + 1);
  });
  $("share").addEventListener("click", function () {
    var url = location.href, btn = this;
    if (navigator.share) { navigator.share({ title: current ? current.t : document.title, url: url }).catch(function () {}); return; }
    navigator.clipboard.writeText(url).then(function () { btn.textContent = "Link copiato"; setTimeout(function () { btn.textContent = "Condividi"; }, 1600); });
  });

  var timer;
  $("q").addEventListener("input", function (e) { clearTimeout(timer); timer = setTimeout(function () { state.q = e.target.value; render(); }, 120); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  render();

  function openFromHash() {
    var slug = decodeURIComponent(location.hash.slice(1));
    var it = slug && items.find(function (x) { return x.s === slug; });
    if (it) open(it);
  }
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
})();
</script>
